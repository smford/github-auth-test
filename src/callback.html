<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing you in… — GitHub Pages Auth Demo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <a href="index.html" class="header-brand">
      <svg height="24" viewBox="0 0 16 16" width="24" aria-hidden="true" fill="#e6edf3">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87
          2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59
          .82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27
          2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92
          .08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73
          .54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      GitHub Pages Demo
    </a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="page1.html">Page 1</a>
      <a href="page2.html">Page 2</a>
    </nav>
    <div></div>
  </header>

  <main aria-live="polite">
    <div class="loading-screen" id="status-screen">
      <div class="spinner" role="status" aria-label="Completing sign-in…"></div>
      <p id="status-msg">Completing sign-in…</p>
    </div>

    <!-- Shown only on error -->
    <div class="error-box" id="error-box" hidden style="max-width:480px;margin:4rem auto;">
      <h2>Sign-in failed</h2>
      <p id="error-msg" style="color:var(--color-muted);margin-top:0.5rem;"></p>
      <br />
      <a href="index.html" class="btn btn-primary">Try again</a>
    </div>
  </main>

  <footer>
    <p>Deployed via GitHub Actions · Protected by GitHub OAuth</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);

      // GitHub sends an error param when the user denies access
      if (params.get("error")) {
        showError(
          params.get("error_description") ||
          "GitHub denied the OAuth request. Please try again."
        );
        return;
      }

      if (!params.get("code")) {
        showError("No OAuth code found. Did you arrive here directly?");
        return;
      }

      try {
        await Auth.handleCallback();
        // handleCallback redirects the browser — nothing else runs here
      } catch (err) {
        showError(err.message);
      }
    })();

    function showError(msg) {
      document.getElementById("status-screen").hidden = true;
      document.getElementById("error-box").hidden = false;
      document.getElementById("error-msg").textContent = msg;
    }
  </script>
</body>
</html>
